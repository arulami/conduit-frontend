schema_version: "1.1"
name: guest-filter-by-popular-tag
expected_outcome: |
  A guest spec that clicks a tag in Popular Tags, captures the tag name before clicking, and asserts the feed tab and the listed articles relate to that tag.
context:
  scaffold_script: scaffold.sh
graders:
  - name: 01-guest-folder
    type: file_exists
    path: 'tests/ui-tests/guest/*.spec.ts'
  - name: 06-uses-pom-fixture
    type: regex
    target: trace
    pattern: '"name":"Write","input":\{"file_path":"[^"]*\.spec\.ts","content":"(?:[^"\\]|\\.)*?from (?:\\"|'')(?:\.\./)+playwright-utils/ui/fixtures(?:\\"|'')'
    match: contains
  - name: 10-no-banned-patterns
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit)","input":\{(?=(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*/(?:tests|playwright-utils)/)(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"(?:content|new_string)":"(?:[^"\\]|\\.)*?(?:waitForTimeout|expect\.soft|setTimeout\(|timeout: ?\d|locator\((?:\\"|'')\.)'
    match: not_contains
  - name: 13-lists-without-errors
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?playwright test(?:[^"\\]|\\.)*--list'
  - name: 09a-starts-from-home
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit)","input":\{(?=(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*\.spec\.ts")(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"(?:content|new_string)":"(?:[^"\\]|\\.)*?pom\.homePage\.open\(\)'
    match: contains
  - name: 09b-no-goto-in-spec
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit)","input":\{(?=(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*\.spec\.ts")(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"(?:content|new_string)":"(?:[^"\\]|\\.)*?\.goto\('
    match: not_contains
  - name: 12a-no-test-run-before-asking
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:playwright test|test:e2e)(?!(?:[^"\\]|\\.)*--list)'
    min: 0
    max: 0
  - name: 12b-offers-run-the-test
    type: regex
    target: last_message
    pattern: 'Run the test'
    flags: i
    match: contains
