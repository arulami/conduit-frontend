schema_version: "1.1"
name: user-favorite-second-article
expected_outcome: |
  A user spec that opens Global Feed, favourites the second article card, checks that card's count went up by one, then unfavourites it. The favourite button and count are scoped to the second card, not picked page-wide.
context:
  scaffold_script: scaffold.sh
graders:
  - name: 05-uses-pom-fixture
    type: regex
    target: trace
    pattern: '"name":"Write","input":\{"file_path":"[^"]*\.spec\.ts","content":"(?:[^"\\]|\\.)*?from (?:\\"|'')(?:\.\./)+playwright-utils/ui/fixtures(?:\\"|'')'
    match: contains
  - name: 09-no-banned-patterns
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit)","input":\{(?=(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*/(?:tests|playwright-utils)/)(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"(?:content|new_string)":"(?:[^"\\]|\\.)*?(?:waitForTimeout|expect\.soft|setTimeout\(|timeout: ?\d|locator\((?:\\"|'')\.)'
    match: not_contains
  - name: 12-lists-without-errors
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?playwright test(?:[^"\\]|\\.)*--list'
  - name: 08a-starts-from-home
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit)","input":\{(?=(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*\.spec\.ts")(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"(?:content|new_string)":"(?:[^"\\]|\\.)*?pom\.homePage\.open\(\)'
    match: contains
  - name: 08b-no-goto-in-spec
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit)","input":\{(?=(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*\.spec\.ts")(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"(?:content|new_string)":"(?:[^"\\]|\\.)*?\.goto\('
    match: not_contains
  - name: 11a-no-test-run-before-asking
    type: tool_used
    tool: Bash
    input_match: '"command":"(?:[^"\\]|\\.)*?(?:playwright test|test:e2e)(?!(?:[^"\\]|\\.)*--list)'
    min: 0
    max: 0
  - name: 11b-offers-run-the-test
    type: regex
    target: last_message
    pattern: 'Run the test'
    flags: i
    match: contains
