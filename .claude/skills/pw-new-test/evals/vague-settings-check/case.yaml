schema_version: "1.1"
name: vague-settings-check
expected_outcome: |
  Claude does not invent a detailed test from vague steps. It asks what 'works' means, or states the specific checks it chose before writing, and never changes the shared account's email or password.
context:
  scaffold_script: scaffold.sh
graders:
  - name: 03-user-folder
    type: regex
    target: files
    pattern: '^tests/(?!ui-tests/user/)\S*\.spec\.ts$'
    match: not_contains
    flags: m
  - name: 04-uses-pom-fixture
    type: regex
    target: trace
    pattern: '"name":"Write","input":\{"file_path":"[^"]*\.spec\.ts","content":"(?:[^"\\]|\\.)*?from (?:\\"|'')@playwright/test(?:\\"|'')'
    match: not_contains
  - name: 08-no-banned-patterns
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit)","input":\{(?=(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*/(?:tests|playwright-utils)/)(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"(?:content|new_string)":"(?:[^"\\]|\\.)*?(?:waitForTimeout|expect\.soft|setTimeout\(|timeout: ?\d|locator\((?:\\"|'')\.)'
    match: not_contains
  - name: 07b-no-goto-in-spec
    type: regex
    target: trace
    pattern: '"name":"(?:Write|Edit)","input":\{(?=(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"file_path":"[^"]*\.spec\.ts")(?:[^{}"]|"(?:[^"\\]|\\.)*")*?"(?:content|new_string)":"(?:[^"\\]|\\.)*?\.goto\('
    match: not_contains
